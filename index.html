<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цвета Дойнова — Живот и психология в червено</title>
<meta name="description" content="Цвета Дойнова — красотата е мой култ. 30 години живот в червено. Психолог, модел, автентичност.">
<meta property="og:type" content="website">
<meta property="og:title" content="Цвета Дойнова — Живот и психология в червено">
<meta property="og:description" content="Контрастът е моята същност и моето изкуство. Красотата е мой култ.">
<meta property="og:image" content="photo-v1.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="photo-v1.jpg">
<meta name="theme-color" content="#0d0505">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%239b1b1b'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23f8eaea' font-family='Georgia,serif' font-style='italic'%3E%D0%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0505;--ink:#f8eaea;--soft:#c9a0a0;--red:#e03a3a;--red2:#9b1b1b;--gold:#d4a574;
  --disp:'Cormorant Garamond',Georgia,serif;--body:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:0;background:0;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
img{display:block;max-width:100%}

#stage{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
#stage canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}

#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#ui *{pointer-events:auto}
.topbar{
  position:absolute;top:0;left:0;right:0;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(13,5,5,.85),transparent);
}
.brand{font-family:var(--disp);font-style:italic;font-size:2.7rem;letter-spacing:.02em;color:#f8eaea}
.ctrls{display:flex;gap:8px;align-items:center}
.ctrl{
  min-width:44px;min-height:44px;height:44px;border-radius:999px;
  border:1px solid rgba(248,234,234,.28);color:#f8eaea;
  display:flex;align-items:center;justify-content:center;
  padding:0 12px;font-size:1.44rem;letter-spacing:.1em;text-transform:uppercase;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(13,5,5,.45);
  transition:transform .25s,border-color .25s,background .25s;
}
.ctrl:hover,.ctrl:active{border-color:var(--red)}
.ctrl.on{border-color:var(--red);color:var(--red);background:rgba(224,58,58,.14)}
.ctrl.play{width:48px;height:48px;min-width:48px;font-size:2.1rem}
.ctrl .lbl{display:inline}

.clock{
  position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:max(16px,env(safe-area-inset-left));
  font-size:1.36rem;letter-spacing:.16em;color:rgba(248,234,234,.5);
  font-variant-numeric:tabular-nums;
}
.progress{
  position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08);
}
.progress>i{display:block;height:3px;width:0%;background:linear-gradient(90deg,var(--red2),var(--red),var(--gold));transition:width .1s linear}

@media(max-width:640px){
  .brand{font-size:2.4rem}
  .ctrl{min-width:42px;height:42px;padding:0 10px;font-size:1.3rem}
  .ctrl.play{width:46px;height:46px;min-width:46px;font-size:2rem}
  .ctrl .lbl{font-size:0;line-height:0}
  .ctrl .lbl::before{content:"↗";font-size:2rem;line-height:1;letter-spacing:0}
  .clock{font-size:1.24rem;bottom:max(14px,calc(env(safe-area-inset-bottom) + 6px))}
  #intro p{font-size:1.8rem;padding:0 8px}
  .shareCard{padding:20px 18px 28px;padding-bottom:max(28px,env(safe-area-inset-bottom))}
  .shareRow{gap:8px}
  .shareBtn{font-size:.55rem;padding:10px 2px}
}

#intro{
  position:fixed;inset:0;z-index:40;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:28px;transition:opacity 1.2s ease,visibility 1.2s;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro h1{
  font-family:var(--disp);font-weight:400;font-size:clamp(4.4rem,12vw,7.2rem);
  color:var(--red);margin-bottom:.35em;font-style:italic;
}
#intro p{max-width:420px;line-height:1.65;color:rgba(248,234,234,.65);font-size:1.9rem;margin-bottom:2em}
#startBtn{
  background:var(--red);color:#fff;border:0;padding:16px 36px;
  font-size:1.7rem;letter-spacing:.2em;text-transform:uppercase;border-radius:999px;
  font-family:var(--body);cursor:pointer;transition:transform .25s,background .25s;
  box-shadow:0 10px 30px rgba(224,58,58,.35);
}
#startBtn:hover{transform:translateY(-2px);background:#c42a2a}

.shareSheet{
  position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,2,2,.92);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;
}
.shareSheet.on{opacity:1;visibility:visible}
.shareCard{
  background:#1c0c0c;color:#f8eaea;width:min(400px,94vw);
  border-radius:22px 22px 0 0;padding:24px 24px 30px;
  transform:translateY(40px);transition:transform .4s cubic-bezier(.16,1,.3,1);position:relative;
  border:1px solid rgba(224,58,58,.2);
}
.shareSheet.on .shareCard{transform:translateY(0)}
@media(min-width:640px){.shareSheet{align-items:center}.shareCard{border-radius:20px}}
.shareCard img{width:100%;border-radius:12px;aspect-ratio:3/4;object-fit:cover;margin-bottom:14px}
.shareCard h3{font-family:var(--disp);font-style:italic;font-weight:400;font-size:1.35rem;margin-bottom:4px}
.shareCard p{font-size:.85rem;color:var(--soft);margin-bottom:16px}
.shareRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shareBtn{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;
  border-radius:14px;border:1px solid rgba(248,234,234,.14);font-size:.6rem;
  letter-spacing:.08em;text-transform:uppercase;color:#f8eaea;
}
.shareBtn .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:.85rem}
.shareBtn.fb .ic{background:#3b5998}
.shareBtn.vb .ic{background:#7360f2}
.shareBtn.wa .ic{background:#25D366}
.shareBtn.cp .ic{background:var(--red2)}
.shareClose{
  position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(248,234,234,.2);color:#f8eaea;
}
</style>
</head>
<body>

<div id="intro">
  <h1>Цвета Дойнова</h1>
  <p>Живот и психология в червено. Красотата е мой култ.</p>
  <button id="startBtn" type="button">▶ Пусни</button>
</div>

<div id="stage"><canvas id="c"></canvas></div>

<div id="ui">
  <div class="topbar">
    <div class="brand">ЦД</div>
    <div class="ctrls">
      <button class="ctrl play" id="musicBtn" type="button" title="Музика" aria-label="Музика">♪</button>
      <button class="ctrl" id="shareBtn" type="button" title="Сподели" aria-label="Сподели"><span class="lbl">Share</span></button>
      <button class="ctrl" id="fsBtn" type="button" title="Цял екран">⛶</button>
    </div>
  </div>
  <div class="clock" id="clock">00:00 / 01:20</div>
  <div class="progress"><i id="bar"></i></div>
</div>

<div class="shareSheet" id="shareSheet" aria-hidden="true">
  <div class="shareCard">
    <button class="shareClose" id="shareClose" type="button" aria-label="Затвори">×</button>
    <img src="photo-v1.jpg" alt="Цвета Дойнова" id="shareImg">
    <h3>Цвета Дойнова</h3>
    <p>Живот и психология в червено. Красотата е мой култ.</p>
    <div class="shareRow">
      <button class="shareBtn fb" type="button" data-net="facebook"><span class="ic">f</span>Facebook</button>
      <button class="shareBtn vb" type="button" data-net="viber"><span class="ic">V</span>Viber</button>
      <button class="shareBtn wa" type="button" data-net="whatsapp"><span class="ic">W</span>WhatsApp</button>
      <button class="shareBtn cp" type="button" id="copyBtn"><span class="ic">↗</span>Копирай</button>
    </div>
  </div>
</div>

<audio id="bgm" loop preload="auto" src="song.mp3"></audio>

<script>
(function(){
"use strict";
const VW=1920, VH=1080, CX=VW/2, CY=VH/2;
const DURATION=80;

const PHOTOS=[
  {src:'photo-v1.jpg', title:'Цвета Дойнова', sub:'Красотата е мой култ'},
  {src:'photo-v2.jpg', title:'Червено', sub:'Сила и елегантност'},
  {src:'photo-v8.jpg', title:'Червена чаша', sub:'Ритуал на присъствието'},
  {src:'photo-v5.jpg', title:'Поглед', sub:'Автентичност без маска'},
  {src:'photo-v4.jpg', title:'Контраст', sub:'Сред руините — стил'},
  {src:'photo-w1.jpg', title:'Път', sub:'Червено в зеленото'},
  {src:'photo-v6.jpg', title:'Рози', sub:'Полето на страстта'},
  {src:'photo-w2.jpg', title:'Макове', sub:'Безкрайно червено'},
  {src:'photo-v3.jpg', title:'Огледало', sub:'В свят на отражения'},
  {src:'photo-w3.jpg', title:'Гора', sub:'Тишина и цвят'},
  {src:'photo-v7.jpg', title:'Очила', sub:'Личен почерк'}
];

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const images=[];
let loaded=0;

function fit(){
  const s=Math.min(innerWidth/VW, innerHeight/VH);
  canvas.width=VW; canvas.height=VH;
  canvas.style.width=(VW*s)+'px';
  canvas.style.height=(VH*s)+'px';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,120));
fit();

PHOTOS.forEach((p,i)=>{
  const img=new Image();
  img.onload=()=>{loaded++;};
  img.onerror=()=>{loaded++;};
  img.src=p.src;
  images[i]=img;
});

const clamp=x=>Math.max(0,Math.min(1,x));
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const SLOT=DURATION/PHOTOS.length;

function drawCover(img, local, ken){
  if(!img || !img.complete || !img.naturalWidth) return;
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const scale0=Math.max(VW/iw, VH/ih);
  const zoom=1 + ken.z * easeInOut(local);
  const scale=scale0*zoom;
  const dw=iw*scale, dh=ih*scale;
  const ox=ken.x * (dw-VW) * local;
  const oy=ken.y * (dh-VH) * local;
  ctx.drawImage(img, (VW-dw)/2+ox, (VH-dh)/2+oy, dw, dh);
}

function drawVignette(s){
  const g=ctx.createRadialGradient(CX,CY,VH*0.12, CX,CY, VH*0.88);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,`rgba(13,5,5,${0.6*s})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
}

function drawFilmGrain(t){
  ctx.save(); ctx.globalAlpha=0.035;
  for(let i=0;i<100;i++){
    const x=(Math.sin(t*11+i*6.7)*0.5+0.5)*VW;
    const y=(Math.cos(t*8+i*4.1)*0.5+0.5)*VH;
    ctx.fillStyle=i%2?'#fff':'#000';
    ctx.fillRect(x,y,1.4,1.4);
  }
  ctx.restore();
}

function drawCaption(title, sub, a){
  if(a<=0.01) return;
  ctx.save();
  ctx.globalAlpha=a;
  const pg=ctx.createLinearGradient(0,VH*0.52,0,VH);
  pg.addColorStop(0,'rgba(13,5,5,0)');
  pg.addColorStop(0.35,'rgba(13,5,5,0.5)');
  pg.addColorStop(1,'rgba(13,5,5,0.88)');
  ctx.fillStyle=pg; ctx.fillRect(0,0,VW,VH);

  ctx.textAlign='left';
  ctx.fillStyle='#e03a3a';
  ctx.font='500 28px Montserrat, system-ui, sans-serif';
  ctx.fillText('ЦВЕТА ДОЙНОВА', 80, VH-232);

  ctx.fillStyle='#f8eaea';
  ctx.font='italic 400 100px Cormorant Garamond, Georgia, serif';
  ctx.fillText(title, 80, VH-160);

  ctx.fillStyle='rgba(248,234,234,0.6)';
  ctx.font='300 36px Montserrat, system-ui, sans-serif';
  ctx.fillText(sub, 80, VH-100);
  ctx.restore();
}

function drawTitleCard(t){
  if(t>5) return;
  const a=t<1?clamp(t):(t>3.5?clamp(1-(t-3.5)/1.5):1);
  ctx.save();
  ctx.fillStyle=`rgba(13,5,5,${0.4*a})`;
  ctx.fillRect(0,0,VW,VH);
  ctx.globalAlpha=a;
  ctx.textAlign='center';
  ctx.fillStyle='#e03a3a';
  ctx.font='500 26px Montserrat,sans-serif';
  ctx.fillText('ЖИВОТ  ·  ПСИХОЛОГИЯ  ·  ЧЕРВЕНО', CX, CY-75);
  ctx.fillStyle='#f8eaea';
  ctx.font='italic 400 124px Cormorant Garamond, Georgia, serif';
  ctx.fillText('Цвета Дойнова', CX, CY+18);
  ctx.fillStyle='rgba(248,234,234,0.55)';
  ctx.font='italic 400 44px Cormorant Garamond, Georgia, serif';
  ctx.fillText('„Красотата е мой култ.“', CX, CY+100);
  ctx.restore();
}

function drawEndCard(t){
  if(t<DURATION-6) return;
  const local=t-(DURATION-6);
  const a=clamp(local/1.5);
  ctx.save();
  ctx.fillStyle=`rgba(13,5,5,${0.55+0.4*a})`;
  ctx.fillRect(0,0,VW,VH);
  ctx.globalAlpha=a;
  ctx.textAlign='center';
  ctx.fillStyle='#e03a3a';
  ctx.font='italic 400 88px Cormorant Garamond, Georgia, serif';
  ctx.fillText('Контрастът е моята същност.', CX, CY-15);
  ctx.fillStyle='rgba(248,234,234,0.5)';
  ctx.font='300 32px Montserrat,sans-serif';
  ctx.fillText('Цвета Дойнова', CX, CY+55);
  ctx.restore();
}

const KEN=[
  {z:0.12,x:0.25,y:-0.15},{z:0.14,x:-0.2,y:0.2},{z:0.1,x:0.15,y:0.2},
  {z:0.13,x:-0.25,y:-0.15},{z:0.11,x:0.3,y:0.1},{z:0.15,x:-0.15,y:0.25},
  {z:0.12,x:0.2,y:-0.2},{z:0.14,x:-0.3,y:0.1},{z:0.1,x:0.1,y:-0.25},
  {z:0.13,x:-0.1,y:0.2},{z:0.12,x:0.22,y:-0.12}
];

let startTime=null, playing=false;

function frame(now){
  if(!playing){ requestAnimationFrame(frame); return; }
  if(startTime===null) startTime=now;
  const t=(now-startTime)/1000;

  if(t>=DURATION){
    ctx.fillStyle='#0d0505'; ctx.fillRect(0,0,VW,VH);
    drawEndCard(DURATION-0.1);
    document.getElementById('bar').style.width='100%';
    document.getElementById('clock').textContent='01:20 / 01:20';
    requestAnimationFrame(frame);
    return;
  }

  const idx=Math.min(PHOTOS.length-1, Math.floor(t/SLOT));
  const local=(t - idx*SLOT)/SLOT;
  const nextIdx=Math.min(PHOTOS.length-1, idx+1);
  const fade=local>0.85? (local-0.85)/0.15 : 0;

  ctx.fillStyle='#0d0505'; ctx.fillRect(0,0,VW,VH);

  ctx.save();
  ctx.globalAlpha=1-fade*0.85;
  drawCover(images[idx], local, KEN[idx%KEN.length]);
  ctx.restore();

  if(fade>0 && nextIdx!==idx){
    ctx.save();
    ctx.globalAlpha=fade*0.9;
    drawCover(images[nextIdx], 0, KEN[nextIdx%KEN.length]);
    ctx.restore();
  }

  drawVignette(0.95);
  drawFilmGrain(t);

  const capIn=clamp(local/0.15);
  const capOut=local>0.75?clamp(1-(local-0.75)/0.2):1;
  drawCaption(PHOTOS[idx].title, PHOTOS[idx].sub, capIn*capOut*(1-fade));

  drawTitleCard(t);
  drawEndCard(t);

  const m=Math.floor(t/60), s=Math.floor(t%60);
  document.getElementById('clock').textContent=
    String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+' / 01:20';
  document.getElementById('bar').style.width=(clamp(t/DURATION)*100)+'%';

  requestAnimationFrame(frame);
}

const bgm=document.getElementById('bgm');
const musicBtn=document.getElementById('musicBtn');
let musicOn=false;
function toggleMusic(){
  if(!musicOn){
    bgm.volume=0.55;
    bgm.play().then(()=>{ musicOn=true; musicBtn.classList.add('on'); musicBtn.textContent='♫'; }).catch(()=>{});
  } else {
    bgm.pause(); musicOn=false; musicBtn.classList.remove('on'); musicBtn.textContent='♪';
  }
}
musicBtn.onclick=toggleMusic;

const sheet=document.getElementById('shareSheet');
document.getElementById('shareBtn').onclick=()=>sheet.classList.add('on');
document.getElementById('shareClose').onclick=()=>sheet.classList.remove('on');
sheet.onclick=e=>{ if(e.target===sheet) sheet.classList.remove('on'); };

function shareUrl(net){
  const url=encodeURIComponent(location.href.split('#')[0]);
  const text=encodeURIComponent('Цвета Дойнова — Живот и психология в червено');
  if(net==='facebook') return `https://www.facebook.com/sharer/sharer.php?u=${url}`;
  if(net==='viber') return `viber://forward?text=${text}%20${url}`;
  if(net==='whatsapp') return `https://wa.me/?text=${text}%20${url}`;
}
document.querySelectorAll('.shareBtn[data-net]').forEach(b=>{
  b.onclick=()=>window.open(shareUrl(b.dataset.net),'_blank','noopener,noreferrer');
});
document.getElementById('copyBtn').onclick=async()=>{
  try{
    await navigator.clipboard.writeText(location.href.split('#')[0]);
    document.getElementById('copyBtn').innerHTML='<span class="ic">✓</span>OK';
    setTimeout(()=>{ document.getElementById('copyBtn').innerHTML='<span class="ic">↗</span>Копирай'; },1600);
  }catch(e){}
};

document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('intro').classList.add('hide');
  playing=true; startTime=null;
  toggleMusic();
  requestAnimationFrame(frame);
};

ctx.fillStyle='#0d0505'; ctx.fillRect(0,0,VW,VH);
ctx.fillStyle='#e03a3a'; ctx.font='italic 84px Georgia'; ctx.textAlign='center';
ctx.fillText('Цвета Дойнова', CX, CY);
})();
</script>
</body>
</html>
